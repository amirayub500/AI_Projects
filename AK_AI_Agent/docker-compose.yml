# Research AI Agent on one server: the web app (+ optional local Ollama).
#
# The model comes from LLM_PROVIDER in .env:
#   anthropic / openai  -> hosted API, fast. Only the app container runs:
#       docker compose up -d --build
#   ollama              -> local model on this server's CPU (slow). Start it too:
#       docker compose --profile local-llm up -d --build
#
#   docker compose up -d --build     start
#   docker compose logs -f app       watch the app
#   docker compose down              stop
#   docker compose exec app python ingest.py data/inbox    import client files
#
# Settings come from the .env file next to this one (copy .env.example).

services:

  # The local LLM server. Models are kept in a volume so they survive restarts.
  ollama:
    image: ollama/ollama
    profiles: ["local-llm"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Runs once: downloads the model into the volume, then exits.
  # (Quick on later starts because the model is already there.)
  model-pull:
    image: ollama/ollama
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen3:1.7b}"]
    restart: "no"

  # The FastAPI app + web UI.
  app:
    build: .
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      MODEL: ${MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # Only used when LLM_PROVIDER=ollama ("ollama" is the other container's name)
      OLLAMA_HOST: http://ollama:11434
      MAX_STEPS: ${MAX_STEPS:-5}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
      RESEARCH_TIMEOUT: ${RESEARCH_TIMEOUT:-900}
      APP_PASSWORD: ${APP_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_TIMEZONE: ${LOG_TIMEZONE:-America/New_York}
      OWNER_IPS: ${OWNER_IPS:-}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-10}
      MAX_TOPIC_CHARS: ${MAX_TOPIC_CHARS:-500}
    volumes:
      # Client data stays on the server, outside the image and outside Git:
      #   ./data/inbox       files to import
      #   ./data/company.db  the database created by ingest.py
      - ./data:/app/data
    ports:
      # Visitors use http://SERVER-IP (port 80) -> app's port 8000
      - "${PUBLIC_PORT:-80}:8000"
    restart: unless-stopped

volumes:
  ollama-models:
